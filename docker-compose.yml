services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8089:8000"      # host:container — nginx/external traffic hits 8089
    volumes:
      - uploads:/var/app/uploads
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ../360_tour_front
    restart: unless-stopped
    ports:
      - "5177:5177"       # nginx inside container also listens on 5177
    volumes:
      - ../360_tour_front/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tour360_prod}
      POSTGRES_USER: ${POSTGRES_USER:-tour360_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zetmax111}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No 'ports' mapping — DB stays internal to the Docker network only

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No 'ports' mapping — Redis stays internal only

volumes:
  postgres_data:
  redis_data:
  uploads:
