server {
    listen 8089 ssl;
    server_name api.360.jbnuu.uz;

    # ── SSL (existing certificates) ──
    ssl_certificate /etc/ssl/jbnuu.uz/fullchain.pem;
    ssl_certificate_key /etc/ssl/jbnuu.uz/jbnuu.uz.key;
    ssl_trusted_certificate /etc/ssl/jbnuu.uz/ca-bundle.crt;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Critical: allow large panorama uploads (up to 80MB+ margin) ──
    client_max_body_size 85M;

    # ── Gzip for JSON API responses ──
    gzip on;
    gzip_vary on;
    gzip_min_length 500;
    gzip_comp_level 6;
    gzip_types application/json;

    # ── Proxy all /api/ requests to FastAPI (uvicorn on localhost:8000 internally) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Health check passthrough ──
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # ── Serve uploaded panorama images directly (bypass FastAPI for speed) ──
    location /scenes/ {
        alias /var/app/uploads/;

        location ~* \.(jpg|jpeg|png|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
            
            # CORS for frontend to load images as WebGL textures
            add_header Access-Control-Allow-Origin "https://360.jbnuu.uz:5177" always;
        }
        location / {
            return 403;
        }

        autoindex off;
    }

    # ── Deny access to hidden files / dotfiles ──
    location ~ /\. {
        deny all;
        return 404;
    }
}
