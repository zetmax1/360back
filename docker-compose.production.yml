version: '3.8'

services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ../360_tour_front
    restart: unless-stopped
    ports:
      - "80:80"
    # To run on HTTPS, map 443:443 and mount certificates to Nginx here

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      # If using separate vars in .env.production, define them, else pass directly
      # We use POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD in .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env.production
    command: redis-server /etc/redis/redis.conf --requirepass $${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  uploads:
