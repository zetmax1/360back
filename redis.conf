# redis.conf
# ─────────────────────────────────────────────────────────────────────────────
# Production Redis Configuration for Tour360
# ─────────────────────────────────────────────────────────────────────────────

# Network security (bind only to local or docker network, never public)
bind 0.0.0.0
protected-mode yes
port 6379

# The password will be provided via CLI argument --requirepass in docker-compose
# requirepass GENERATED_REDIS_PASSWORD_HERE

# Security: Disable dangerous commands to prevent attacks
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command KEYS ""
rename-command DEBUG ""

# Persistence
# Save DB in background if at least 1 key changed in 900s, or 10 keys in 300s
save 900 1
save 300 10
# Append Only File mode provides better durability
appendonly yes
appendfsync everysec

# Memory Management
# 512mb is plenty for our caching needs (tour configs and access blocklists)
maxmemory 512mb
# Evict least recently used keys first when maxmemory is reached
maxmemory-policy allkeys-lru
